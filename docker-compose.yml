# GameCheck — orquestração dos 3 serviços: PostgreSQL + backend (Django) + frontend (SPA).
#
# Subir tudo:      docker compose up --build
# Acessar:         Frontend -> http://localhost:3000
#                  Backend  -> http://localhost:8000   (admin em /admin/)
# Logins de demo:  admin@gamelist.dev / ana@gamelist.dev / bruno@gamelist.dev
#                  senha: senha123   (o admin acessa o /admin/)
# Catálogo:        ~100 jogos famosos da Steam entram via seed_demo, a partir do
#                  snapshot offline catalog/data/steam_top_games.json (sem rede).
#
# Variáveis sensíveis (SECRET_KEY, STEAM_API_KEY, RAWG_API_KEY) podem ser
# sobrescritas por um arquivo .env nesta mesma pasta — os defaults abaixo
# deixam o stack funcional sem configuração extra.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gamelist}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposto em 5434 no host (evita conflito com o Postgres de dev em 5433);
      # o backend acessa internamente por db:5432, sem depender deste mapeamento.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gamelist}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
    - ./backend/.env
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-troque-em-producao}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_NAME: ${DB_NAME:-gamelist}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      
    volumes:
      # Persiste os uploads (avatares) entre reinícios do container.
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Onde o NAVEGADOR alcança o backend (não é a rede interna do Docker).
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
