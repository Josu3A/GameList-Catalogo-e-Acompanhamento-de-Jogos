# Serve o SPA do GameCheck. Como é uma Single Page Application (React Router),
# qualquer rota desconhecida cai no index.html (history fallback).
# As chamadas à API vão direto ao backend em http://localhost:8000 (origem
# separada, já liberada no CORS/CSRF do Django), então não há proxy aqui.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome podem ter cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
